services:
  - type: web
    name: luit-and-loom
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CATALOGUE_PREVIEW_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: luit-and-loom-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: luit-and-loom
          envVarKey: RENDER_EXTERNAL_URL
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: luit-and-loom-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: luit_loom
    user: luit_loom
    ipAllowList: []
