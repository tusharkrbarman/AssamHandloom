services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: luit_loom
      POSTGRES_USER: luit
      POSTGRES_PASSWORD: luit
    ports:
      - "5432:5432"
    volumes:
      - luit_loom_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luit -d luit_loom"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  luit_loom_postgres_data:
